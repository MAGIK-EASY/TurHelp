<!doctype html>
<html lang="ru" class="h-100" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Админ-панель</title>
</head>
<body>
<div class="container">
    <h2 class="my-4">Добавить новый тур</h2>

    <div class="card">
        <div class="card-body">
            <form method="POST" action="{{ url_for('admin_bp.add_tour') }}">
                <div class="mb-3">
                    <label for="country" class="form-label">Страна</label>
                    <input type="text" class="form-control" id="country" name="country" required>
                </div>
				<div class="mb-3">
                    <label for="agencyid" class="form-label">ID Агенства</label>
                    <input type="text" class="form-control" id="agencyid" name="agencyid" required>
                </div>
                <div class="mb-3">
                    <label for="duration" class="form-label">Продолжительность тура</label>
                    <input type="text" class="form-control" id="duration" name="duration" required>
                </div>
                <div class="mb-3">
                    <label for="price" class="form-label">Цена (руб.)</label>
                    <input type="number" class="form-control" id="price" name="price" required>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Описание</label>
                    <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Добавить тур</button>
                <a href="{{ url_for('admin_bp.manage_tours') }}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
