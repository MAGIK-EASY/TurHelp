<!DOCTYPE html>
<html lang="ru" class="h-100" data-bs-theme="dark">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
		<link rel="icon" href="static/images/favicon.ico" type="image/x-icon">
		<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
		<title>Войти</title>
	</head>
	
	<body>
		<main class="login form-signin w-100 m-auto">
			<form action="/login" method="POST">
				<h1 class="h2 mb-3 fw-normal">Войдите</h1>

				  {% with messages = get_flashed_messages(with_categories=true) %}
					{% if messages %}
						{% for category, message in messages %}
							<div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show">
								{{ message }}
								<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
							</div>
						{% endfor %}
					{% endif %}
				  {% endwith %}

				<div class="form-floating">
				  <input type="number" class="form-control" id="floatingInput" name="number" placeholder=" " required>
				  <label for="floatingInput">Номер телефона</label>
				</div>

				<div class="form-floating">
				  <input type="password" class="form-control" id="floatingPassword" name="password" placeholder=" " required pattern=".{8,}" title="Минимум 8 символов">
				  <label for="floatingPassword">Пароль</label>
				</div>

				<div class="form-check text-start my-3">
				  <input class="form-check-input" type="checkbox" value="remember-me" id="flexCheckDefault">
				  <label class="form-check-label" for="flexCheckDefault">
					Запомнить меня
				  </label>
				</div>

				<button class="btn btn-primary w-100 py-2" type="submit">Войти</button>
				
			</form>

			<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

		</main>
	</body>
</html>
