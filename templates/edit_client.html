<!doctype html>
<html lang="ru" class="h-100" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
	<link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/light.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Редактирование пользователя</title>
</head>
<body>
    <div class="container mt-5">
        <h2>Редактирование пользователя</h2>
        
        <div class="mb-3">
            <a href="/admin/clients" type="button" class="btn btn-primary">
                <i class="fas fa-arrow-left me-2"></i>Назад
            </a>
        </div>

        <form method="POST">
            <div class="mb-3">
                <label for="surname" class="form-label">Фамилия</label>
                <input type="text" class="form-control" id="surname" name="surname" value="{{ client.surname }}" required>
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Имя</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ client.name }}" required>
            </div>
            <div class="mb-3">
                <label for="thname" class="form-label">Отчество</label>
                <input type="text" class="form-control" id="thname" name="thname" value="{{ client.thname }}">
            </div>
            <div class="mb-3">
                <label for="birthday" class="form-label">Дата рождения</label>
                <input type="date" class="form-control" id="birthday" name="birthday" value="{{ client.birthday }}">
            </div>
            <div class="mb-3">
                <label for="tnumber" class="form-label">Телефон</label>
                <input type="tel" class="form-control" id="tnumber" name="tnumber" value="{{ client.tnumber }}" required>
            </div>
            <button type="submit" class="btn btn-success">Сохранить</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<button id="theme-switcher-btn" class="theme-switcher-fixed" title="Переключить тему">
    <i class="fas fa-moon"></i>
</button>
</body>
</html>
