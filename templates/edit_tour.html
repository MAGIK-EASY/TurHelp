<!doctype html>
<html lang="ru" class="h-100" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
	<link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/light.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Редактирование тура</title>
</head>
<body>
    <div class="container mt-5">
        <h2>Редактирование тура</h2>
        
        <div class="mb-3">
            <a href="/admin/tours" type="button" class="btn btn-primary">
                <i class="fas fa-arrow-left me-2"></i>Назад
            </a>
        </div>

        <form method="POST">
            <div class="mb-3">
                <label for="country" class="form-label">Страна</label>
                <input type="text" class="form-control" id="country" name="country" value="{{ tour.country }}" required>
            </div>
            <div class="mb-3">
                <label for="agencyid" class="form-label">Агентство</label>
                <select class="form-select" id="agencyid" name="agencyid" required>
                    {% for agency in agencies %}
                    <option value="{{ agency.id }}" {% if agency.id == tour.agencyid %}selected{% endif %}>{{ agency.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="duration" class="form-label">Длительность (дни)</label>
                <input type="number" class="form-control" id="duration" name="duration" value="{{ tour.duration }}" required>
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">Цена</label>
                <input type="number" class="form-control" id="price" name="price" value="{{ tour.price }}" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Описание</label>
                <textarea class="form-control" id="description" name="description" rows="3">{{ tour.description }}</textarea>
            </div>
            <button type="submit" class="btn btn-success">Сохранить</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<button id="theme-switcher-btn" class="theme-switcher-fixed" title="Переключить тему">
    <i class="fas fa-moon"></i>
</button>
</body>
</html>
