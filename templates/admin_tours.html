<!doctype html>
<html lang="ru" class="h-100" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Админ-панель</title>
</head>
<body>
	<div class="container">
		<h2 class="my-4">Управление турами</h2>

		<div class="mb-3">
			<a href="/admin" type="button" class="btn btn-primary">
				<i class="fas fa-arrow-left me-2"></i>Назад
			</a>
		</div>

		<a href="{{ url_for('admin_bp.add_tour') }}" class="btn btn-success mb-3">Добавить тур</a>
		<a href="{{ url_for('admin_bp.export_tours') }}" class="btn btn-success mb-3">Экспорт в Excel</a>

		<div class="table-responsive">
			<table class="table table-striped">
				<thead>
					<tr>
						<th>ID</th>
						<th>Страна</th>
						<th>ID Агенства</th>
						<th>Длительность</th>
						<th>Цена</th>
						<th>Описание тура</th>
						<th></th>
						<th>Действия</th>
					</tr>
				</thead>
				<tbody>
					{% for tour in tours %}
					<tr>
						<td>{{ tour[0] }}</td>
						<td>{{ tour[1] }}</td>
						<td>{{ tour[2] }}</td>
						<td>{{ tour[3] }}</td>
						<td>{{ tour[4] }}</td>
						<td>{{ tour[5] }}</td>
						<td>{{ tour[6] }}</td>			
						<td>
							<form action="{{ url_for('admin_bp.delete_tour', tour_id=tour[0]) }}" method="post" class="d-inline">
								<button type="submit" class="btn btn-danger btn-sm">Удалить</button>
							</form>
						</td>
					</tr>
					{% endfor %}
				</tbody>
			</table>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
