<!doctype html>
<html lang="ru" class="h-100" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
	<link rel="icon" href="static/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/light.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Админ-панель</title>
</head>
<body>
   <header class="header bg-dark sticky-top p-3 mb-3 border-bottom" data-bs-theme="dark">
        <div class="container">
          <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
            <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
              <svg class="bi me-2" width="40" height="32" role="img" aria-label="Bootstrap"><use xlink:href="#bootstrap"></use></svg>
            </a>

            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
              <li><a href="/admin" class="nav-link px-2 text-secondary">Главная</a></li>
              <li><a href="/" class="nav-link px-1 text-white">На сайт</a></li>
            </ul>
			
			<div class="d-flex align-items-center">
					<!-- Кнопка переключения темы -->
					<div class="theme-switcher">
						<button class="theme-switcher-btn" id="theme-switcher-btn" title="Переключить тему">
							<i class="fas fa-moon"></i>
						</button>
					</div>
				<div class="text-end">             
					<button type="button" class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#exit">Выйти</button>
				</div>
			</div>
          </div>
        </div>
   </header>

   <main>

   </main>

   <div class="container">
        <h1 class="my-4">Административная панель</h1>

        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Пользователи</h5>
                        <p class="card-text">Управление пользователями системы</p>
                        <a href=/admin/clients class="btn btn-primary">Перейти</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Туры</h5>
                        <p class="card-text">Управление турами и предложениями</p>
                        <a href="/admin/tours" class="btn btn-primary">Перейти</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Агентства</h5>
                        <p class="card-text">Управление турагентствами</p>
                        <a href="/admin/agencies" class="btn btn-primary">Перейти</a>
                    </div>
                </div>
            </div>
        </div>
   </div>

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

   <!-- Модальное окно -->
   <div class="modal fade" id="exit" tabindex="-1" aria-labelledby="exit" aria-hidden="true">
	  <div class="modal-dialog">
		<div class="modal-content">
		  <div class="modal-header">
			<h1 class="modal-title fs-5" id="exampleModalLabel">Выйти?</h1>
			<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
		  </div>
		  <div class="modal-body">
			Вы действительно хотите выйти?
		  </div>
		  <div class="modal-footer">
			<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
			<a href="{{ url_for('logout') }}" type="button" class="btn btn-primary">Выйти</a>
		  </div>
		</div>
	  </div>
   </div>
   
   <script src="static/js/theme.js"></script>

</body>
</html>
