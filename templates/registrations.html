<!DOCTYPE html>
<html lang="ru" class="h-100" data-bs-theme="dark">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
		<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
		<title>Регистрация</title>
	</head>
	
	<body>
		<main class="login form-signin w-100 m-auto">
		  <form action="/registrations" method="POST">
			<h1 class="h2 mb-3 fw-normal">Регистрация</h1>

			  {% with messages = get_flashed_messages(with_categories=true) %}
				{% if messages %}
					{% for category, message in messages %}
						{% if category != 'login_offer' %}
							<div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show">
								{{ message }}
							</div>
						{% endif %}
					{% endfor %}
				{% endif %}
			  {% endwith %}


			<div class="mt-3 text-center">
			  Уже зарегистрированы? <a href="{{ url_for('login') }}">Войдите</a>
			</div>
			
			<br>

			<div class="form-floating">
			  <input type="text" class="form-control" id="name" name="name" placeholder=" " required>
			  <label for="floatingInput">Имя</label>
			</div>
			
			<div class="form-floating">
			  <input type="text" class="form-control" id="surname" name="surname" placeholder=" " required>
			  <label for="floatingInput">Фамилия</label>
			</div>
			
			<div class="form-floating">
			  <input type="text" class="form-control" id="thname" name="thname" placeholder=" ">
			  <label for="floatingInput">Отчество</label>
			</div>
			
			<div class="form-floating">
			  <input type="date" class="form-control" id="birthday" name="birthday" placeholder=" " required>
			  <label for="floatingInput">Дата рождения</label>
			</div>
			
			<div class="form-floating">
			  <input type="number" class="form-control" id="number" name="number" placeholder=" " required>
			  <label for="floatingInput">Номер телефона</label>
			</div>
			
			<div class="form-floating">
			  <input type="password" class="form-control" id="password" name="password" placeholder=" " required pattern=".{8,}" title="Минимум 8 символов">
			  <label for="floatingInput">Пароль</label>
			</div>
			
			<div class="form-floating">
			  <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder=" " required oninput="validatePassword()">
			  <label for="floatingPassword">Подтвердите пароль</label>
			</div>
			<span id="message"></span>
			
			<br>
			
			<button class="btn btn-primary w-100 py-2" type="submit" onclick="Upd()">Зарегистрироваться</button>
		  </form>		  

		  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
		</main>
	</body>
</html>

<script>
function validatePassword() {
  if(document.getElementById('password').value === 
     document.getElementById('confirm_password').value) {
    document.getElementById('message').innerText = ' ';
    document.getElementById('confirm_password').setCustomValidity('');
  } else {
    document.getElementById('message').innerText = '  ';
    document.getElementById('confirm_password').setCustomValidity('Пароли должны совпадать.');
  }
}
</script>
